[project]
name = "creator-studio-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "firebase-admin>=7.6.0",
    "google-adk>=2.9.2",
    "google-api-python-client>=2.200.0",
    "google-cloud-bigquery>=3.45.2",
    "google-cloud-firestore>=2.31.0",
    "google-cloud-kms>=3.17.0",
    "google-cloud-pubsub>=2.41.0",
    "google-cloud-secret-manager>=2.30.0",
    "google-cloud-speech>=2.40.0",
    "google-cloud-storage>=3.14.1",
    "google-cloud-texttospeech>=2.38.0",
    "google-cloud-translate>=3.28.0",
    "google-genai>=2.24.0",
    "numpy>=2.5.4",
    "pillow>=12.0.0",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.0",
    "uvicorn[standard]>=0.53.0",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
