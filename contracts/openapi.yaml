    CreatorLibraryNode:
      type: object
      required: [id, itemId, title, kind, modality, excerpt, indexed]
      properties:
        id: { type: string }
        itemId: { type: string }
        title: { type: string }
        kind: { type: string, enum: [video, article, post, profile] }
        modality: { type: string, enum: [text, image] }
        excerpt: { type: string }
        url: { type: [string, "null"] }
        thumbnailUrl: { type: [string, "null"] }
        startSeconds: { type: [number, "null"] }
        platform: { type: string }
        language: { type: string }
        tags: { type: array, items: { type: string } }
        contentType: { type: string }
        attribution: { type: string }
        collectionMethod: { type: string }
        related:
          type: array
          description: Top three cosine neighbors from different sources, plus the closest other modality when absent, in the full embedding space
          items:
            type: object
            required: [nodeId, similarity]
            properties:
              nodeId: { type: string }
              similarity: { type: number, minimum: -1, maximum: 1 }
              relation: { type: string, enum: [nearest, cross_modal] }
        indexed: { type: boolean }
        x: { type: [number, "null"], description: "Approximate PCA coordinate in [0,1]" }
        y: { type: [number, "null"], description: "Approximate PCA coordinate in [0,1]" }
        score: { type: [number, "null"], description: Cosine similarity or lexical overlap; never confidence }
    CreatorLibrary:
      type: object
      required: [sourceType, displayName, model, dimensions, itemCount, totalNodes, indexedNodes, omittedPassages, nodes, projection]
      properties:
        sourceType: { type: [string, "null"], enum: [folder_import, youtube, null] }
        displayName: { type: string }
        model: { type: string }
        dimensions: { type: integer }
        itemCount: { type: integer }
        totalNodes: { type: integer }
        indexedNodes: { type: integer }
        omittedPassages: { type: integer }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/CreatorLibraryNode" }
        projection: { type: string, const: pca }
        errorMessage: { type: [string, "null"] }
    CreatorLibrarySearch:
      type: object
      required: [mode, matches]
      properties:
        mode: { type: string, enum: [semantic, lexical] }
        matches:
          type: array
          items: { $ref: "#/components/schemas/CreatorLibraryNode" }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: [string, "null"] }
            details: { type: object, additionalProperties: true }

    Severity:
      type: string
      enum: [none, low, medium, high, critical]

    Me:
      type: object
      properties:
        uid: { type: string }
        displayName: { type: [string, "null"] }
        email: { type: [string, "null"] }
        onboardingCompleted: { type: boolean }
        personaVersion: { type: [integer, "null"] }
        preferences:
          type: object
          properties:
            timezone: { type: string }
            defaultLanguage: { type: string }
        avatar: { $ref: "#/components/schemas/AvatarState" }
        readOnly:
          type: boolean
          description: |
            True for the read-only demo account. The API rejects every mutating request from
            this user with 403 and the web client disables the matching controls.

    AvatarState:
      type: object
      description: |
        Humation avatar: a deterministic seed plus per-slot part selections and
        color overrides. Rendered locally; stored on the user document.
      properties:
        seed: { type: [string, "null"] }
        selections: { type: object, additionalProperties: { type: string } }
        colors: { type: object, additionalProperties: { type: string } }

    OnboardingState:
      type: object
      properties:
        status: { type: string, enum: [not_started, in_progress, completed] }
        currentStep: { type: [string, "null"] }
        answers: { type: object, additionalProperties: true }

    OnboardingStep:
      type: object
      required: [step, answers]
      properties:
        step: { type: string }
        answers: { type: object, additionalProperties: true }

    PersonaRef:
      type: object
      properties:
        onboardingCompleted: { type: boolean }
        personaVersion: { type: integer }
        personaStoragePath: { type: string }

    Persona:
      type: object
      properties:
        version: { type: integer }
        content: { type: string }
        storagePath: { type: string }

    OnboardingResearchRequest:
      type: object
      required: [links]
      properties:
        links:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string }
          description: Public creator profile URLs (YouTube, Instagram, X, Facebook, TikTok, LinkedIn).

    ResearchSource:
      type: object
      properties:
        title: { type: string }
        url: { type: string }

    OnboardingResearch:
      type: object
      properties:
        answers:
          type: object
          additionalProperties: true
          description: Full merged onboarding answers after research; load straight into the form.
        sources:
          type: array
          items: { $ref: "#/components/schemas/ResearchSource" }
        queries:
          type: array
          items: { type: string }
          description: Search queries the grounded model ran.
        searchSuggestions:
          type: string
          description: |
            Google-provided Search Suggestions HTML. Google's grounding terms require rendering it
            exactly as returned whenever the grounded response is shown.

    CreateProject:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        thumbnailConcept:
          type: string
          description: What the thumbnail promises, so a hook can be judged against it.
        primaryLanguage: { type: string, default: en }
        targetLanguages: { type: array, items: { type: string } }
        targetPlatforms: { type: array, items: { type: string } }
        kind:
          type: string
          enum: [video, draft]
          default: video
          description: |
            `video` runs the upload -> transcript -> review pipeline; `draft`
            opens the versioned writing studio instead.
        draftFormat:
          $ref: "#/components/schemas/DraftFormat"
        draftBrief:
          $ref: "#/components/schemas/DraftBrief"
        sourceDraftId:
          type: [string, "null"]
          description: |
            Script source for a video project: the draft project this video is
            based on. Only valid when `kind` is video; the service snapshots the
            draft title. Title-only link — the draft text itself is never copied.
        isDemo: { type: boolean, default: false }
        demoProfileId: { type: [string, "null"] }

    Project:
      allOf:
        - $ref: "#/components/schemas/CreateProject"
        - type: object
          properties:
            projectId: { type: string }
            status:
              type: string
              enum: [draft, uploading, processing, ready, partial_failure, failed, archived]
            progress:
              type: [object, "null"]
              properties:
                stage: { type: [string, "null"] }
                percent: { type: integer }
                message: { type: [string, "null"] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            sourceAssetId:
              type: [string, "null"]
              description: The project's active source-video asset.
            sourceRevision:
              type: [integer, "null"]
              description: Revision number of the active source video; null if none uploaded.
            revisionCount:
              type: integer
              description: Number of source-video revisions uploaded for this project.
            posterStoragePath:
              type: [string, "null"]
              description: |
                Cloud Storage object of the applied thumbnail concept, if any.
            posterUrl:
              type: [string, "null"]
              description: |
                Short-lived signed URL for `posterStoragePath`, minted on read. Use it as the
                project's cover in cards and as the player poster.
            kind:
              type: string
              enum: [video, draft]
              description: Which studio the project opens into.
            draftFormat:
              $ref: "#/components/schemas/DraftFormat"
            draftSummary:
              oneOf:
                - $ref: "#/components/schemas/DraftSummary"
                - type: "null"
              description: Draft stats for list cards; null for video projects.
            sourceDraftId:
              type: [string, "null"]
              description: Script source — the draft project this video is based on, if any.
            sourceDraftName:
              type: [string, "null"]
              description: |
                Draft title snapshotted at link time, so the lineage renders without a
                join. A deleted draft leaves the pointer dangling: clients show the
                title as plain text with an unlink action instead of failing.

    UploadSessionRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 1 }

    UploadSession:
      type: object
      properties:
        assetId: { type: string }
        storagePath: { type: string }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        requiredHeaders:
          type: object
          additionalProperties: { type: string }

    Asset:
      type: object
      properties:
        assetId: { type: string }
        projectId: { type: string }
        type:
          type: string
          enum: [source_video, audio, frame, clip, thumbnail, caption, export]
        status:
          type: string
          enum: [pending, uploading, uploaded, processing, ready, failed, deleted]
        storagePath: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        durationMs: { type: [integer, "null"] }
        revision:
          type: [integer, "null"]
          description: |
            Source-video revision number. Null for non-source assets and for legacy
            source videos uploaded before revisions existed.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AssetList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }

    DownloadUrl:
      type: object
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    Revision:
      type: object
      properties:
        revision:
          type: integer
          description: Monotonic revision number (1 is the first upload).
        assetId: { type: string }
        status: { $ref: "#/components/schemas/AssetStatus" }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        durationMs: { type: [integer, "null"] }
        storagePath: { type: string }
        isActive:
          type: boolean
          description: Whether this revision is the project's active source video.
        transcriptId:
          type: [string, "null"]
          description: The newest transcript built from this revision, if any.
        transcriptVersion: { type: [integer, "null"] }
        analysisRunCount:
          type: integer
          description: How many analysis runs were built from this revision.
        createdAt: { type: string, format: date-time }

    RevisionList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Revision" }

    RevisionActivation:
      type: object
      properties:
        assetId: { type: string }
        revision: { type: integer }
        transcriptId:
          type: [string, "null"]
          description: The transcript made active, or null when one had to be generated.
        jobId:
          type: [string, "null"]
          description: The queued transcribe job when no transcript existed yet.

    Job:
      type: object
      properties:
        jobId: { type: string }
        type: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progress:
          type: object
          properties:
            percent: { type: integer }
            step: { type: string }
            message: { type: string }
        error: { type: [object, "null"], additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TranscriptSegment:
      type: object
      properties:
        segmentId: { type: string }
        index: { type: integer }
        startMs: { type: integer }
        endMs: { type: integer }
        text: { type: string }
        speaker: { type: [integer, "null"] }

    Transcript:
      type: object
      properties:
        transcriptId: { type: string }
        language: { type: string }
        durationMs: { type: integer }
        segments:
          type: array
          items: { $ref: "#/components/schemas/TranscriptSegment" }
        speakerLabels:
          type: object
          description: |
            Map of speaker index to a short role or name inferred during transcript
            cleanup (for example {"0": "Host", "1": "Guest"}). Empty when the voices
            could not be named.
          additionalProperties: { type: string }

    TranscriptSegmentUpdate:
      type: object
      required: [segmentId, index, startMs, endMs, text]
      properties:
        segmentId: { type: string }
        index: { type: integer }
        startMs: { type: integer }
        endMs: { type: integer }
        text: { type: string }
        speaker: { type: [integer, "null"] }

    TranscriptUpdate:
      type: object
      required: [segments]
      properties:
        language: { type: [string, "null"] }
        segments:
          type: array
          items: { $ref: "#/components/schemas/TranscriptSegmentUpdate" }
        speakerLabels:
          type: [object, "null"]
          additionalProperties: { type: string }
          description: |
            Speaker index to display name, e.g. { "0": "Host" }. Sent by the editor
            when a speaker is renamed. Omitted or null keeps the active
            transcript's labels.

    TranscriptVersion:
      type: object
      properties:
        transcriptId: { type: string }
        version: { type: integer }
        language: { type: string }
        durationMs: { type: integer }
        wordCount: { type: integer }
        createdAt: { type: [string, "null"], format: date-time }

    TranscriptVersionList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TranscriptVersion" }

    CaptionStyle:
      type: object
      description: |
        How burned captions look. Sizes are pixels at a 1080-tall reference frame and are
        scaled to the real video, so one preset fits landscape and vertical footage.
      properties:
        preset: { type: string, default: clean }
        fontFamily: { type: string, enum: [Montserrat, Poppins], default: Montserrat }
        fontSize: { type: integer, minimum: 18, maximum: 140, default: 54 }
        bold: { type: boolean, default: true }
        italic: { type: boolean, default: false }
        uppercase: { type: boolean, default: false }
        textColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", default: "#FFFFFF" }
        outlineColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", default: "#000000" }
        outlineWidth: { type: integer, minimum: 0, maximum: 16, default: 3 }
        shadow: { type: integer, minimum: 0, maximum: 16, default: 2 }
        background: { type: string, enum: [outline, box, none], default: outline }
        backgroundColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", default: "#000000" }
        backgroundOpacity: { type: integer, minimum: 0, maximum: 100, default: 60 }
        position: { type: string, enum: [top, middle, bottom], default: bottom }
        marginV: { type: integer, minimum: 0, maximum: 600, default: 72 }
        maxCharsPerLine: { type: integer, minimum: 12, maximum: 64, default: 32 }
        maxLines: { type: integer, minimum: 1, maximum: 4, default: 2 }
        highlightEnabled:
          type: boolean
          default: false
          description: Karaoke highlight — spoken words fill with `highlightColor`.
        highlightColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", default: "#FFD400" }
        speakerLabels:
          type: boolean
          default: false
          description: Prefix each cue with the speaker name when there is more than one voice.

    CaptionRenderRequest:
      type: object
      properties:
        style: { $ref: "#/components/schemas/CaptionStyle" }
        transcriptVersion:
          type: [integer, "null"]
          description: Render a specific saved transcript version; defaults to the active one.
        localizationId:
          type: [string, "null"]
          description: |
            Burn a finished dub's localized captions onto its dubbed video instead of the source
            transcript. The cues come from the localization's localized SRT and the source video
            is the dubbed MP4; `transcriptVersion` is ignored.
        fileName: { type: [string, "null"], maxLength: 200 }

    CaptionPreset:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        style: { $ref: "#/components/schemas/CaptionStyle" }

    CaptionPresetList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CaptionPreset" }

    CaptionRender:
      type: object
      properties:
        captionRenderId: { type: string }
        projectId: { type: string }
        status: { type: string, enum: [queued, rendering, ready, failed] }
        style: { $ref: "#/components/schemas/CaptionStyle" }
        sourceAssetId: { type: [string, "null"] }
        sourceTranscriptId: { type: [string, "null"] }
        transcriptVersion: { type: [integer, "null"] }
        localizationId:
          type: [string, "null"]
          description: Set when this render burns a dub's localized captions onto its dubbed video.
        fileName: { type: [string, "null"] }
        storagePath: { type: [string, "null"] }
        assStoragePath: { type: [string, "null"] }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        durationMs: { type: integer }
        width: { type: integer }
        height: { type: integer }
        jobId: { type: [string, "null"] }
        error: { type: [object, "null"], additionalProperties: true }
        downloadUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CaptionRenderList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CaptionRender" }

    CaptionRenderAccepted:
      type: object
      properties:
        captionRenderId: { type: string }
        jobId: { type: string }
        status: { type: string }

    ThumbnailAspect:
      type: string
      enum: ["16:9", "9:16", "1:1"]

    ThumbnailStatus:
      type: string
      enum: [queued, generating, ready, failed]

    ThumbnailCritique:
      type: object
      description: An honest read of a generated thumbnail, each axis scored 1-5.
      properties:
        legibility:
          type: integer
          minimum: 0
          maximum: 5
          description: Can the headline be read at phone size?
        promise:
          type: integer
          minimum: 0
          maximum: 5
          description: Does the thumbnail promise what the video actually delivers?
        platformFit:
          type: integer
          minimum: 0
          maximum: 5
        summary: { type: string }
        suggestions: { type: array, items: { type: string } }

    ThumbnailVersion:
      type: object
      description: One immutable generated image; edits append versions.
      properties:
        versionId: { type: string }
        version: { type: integer }
        storagePath: { type: [string, "null"] }
        mimeType: { type: string }
        width: { type: integer }
        height: { type: integer }
        sizeBytes: { type: integer }
        instruction:
          type: string
          description: The visual direction (v1) or the creator's edit instruction (later).
        headline: { type: string }
        rationale: { type: string }
        referenceTimestampsMs:
          type: array
          items: { type: integer }
          description: Source-video offsets used as reference frames for this version.
        critique:
          oneOf:
            - $ref: "#/components/schemas/ThumbnailCritique"
            - type: "null"
        model: { type: string }
        costUsd: { type: number }
        createdAt: { type: string, format: date-time }

    ThumbnailConcept:
      type: object
      properties:
        thumbnailId: { type: string }
        projectId: { type: string }
        status: { $ref: "#/components/schemas/ThumbnailStatus" }
        aspect: { $ref: "#/components/schemas/ThumbnailAspect" }
        headline: { type: string }
        rationale: { type: string }
        sourceTimestampMs: { type: [integer, "null"] }
        referenceTimestampsMs: { type: array, items: { type: integer } }
        activeVersionId: { type: [string, "null"] }
        versions: { type: array, items: { $ref: "#/components/schemas/ThumbnailVersion" } }
        isApplied:
          type: boolean
          description: True when written to `project.thumbnailConcept`.
        jobId: { type: [string, "null"] }
        error: { type: [object, "null"], additionalProperties: true }
        previewUrl:
          type: [string, "null"]
          description: Signed URL for the active version, minted on read for ready concepts.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ThumbnailConceptList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ThumbnailConcept" }

    GenerateThumbnailsRequest:
      type: object
      properties:
        count: { type: integer, minimum: 1, maximum: 6, default: 4 }
        aspect: { $ref: "#/components/schemas/ThumbnailAspect" }
        imageSize: { type: string, enum: ["512", "1K", "2K", "4K"], default: "1K" }
        brief: { type: string, maxLength: 600 }
        useRealFrames:
          type: boolean
          default: true
          description: Use the project's real frames as references so the creator's likeness survives.
        useProModel: { type: boolean, default: false }

    ReviseThumbnailRequest:
      type: object
      required: [instruction]
      properties:
        instruction: { type: string, minLength: 1, maxLength: 600 }

    ThumbnailBatchAccepted:
      type: object
      properties:
        thumbnailIds: { type: array, items: { type: string } }
        jobId: { type: string }
        status: { type: string }

    ThumbnailRevisionAccepted:
      type: object
      properties:
        thumbnailId: { type: string }
        jobId: { type: string }
        status: { type: string }

    ThumbnailSelectionRequest:
      type: object
      required: [thumbnailIds]
      properties:
        thumbnailIds:
          type: array
          minItems: 1
          maxItems: 24
          items: { type: string }

    LocalizationVoice:
      type: object
      properties:
        id: { type: string, description: Stable id stored on a localization. }
        name:
          type: string
          description: Provider voice name (for example `en-US-Neural2-D`). Server-side only.
        label: { type: string }
        gender: { type: string, enum: [male, female, neutral] }
      required: [id, name, label, gender]

    LocalizationLanguage:
      type: object
      properties:
        language: { type: string, description: BCP-47 short code, for example `en`. }
        label: { type: string }
        voices:
          type: array
          items: { $ref: "#/components/schemas/LocalizationVoice" }
      required: [language, label, voices]

    LocalizationVoiceList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LocalizationLanguage" }

    LocalizationRequest:
      type: object
      required: [targetLanguage]
      properties:
        targetLanguage:
          type: string
          description: Short target language code, for example `en`.
        voice:
          type: [string, "null"]
          description: Preferred voice id for speaker 0; other speakers borrow the next voices.
        transcriptVersion: { type: [integer, "null"] }
        keepOriginalAudio:
          type: boolean
          default: false
          description: Mix the source audio quietly under the dub instead of replacing it.
        fileName: { type: [string, "null"], maxLength: 200 }

    LocalizationStatus:
      type: string
      enum: [queued, translating, synthesizing, muxing, ready, failed]

    Localization:
      type: object
      properties:
        localizationId: { type: string }
        projectId: { type: string }
        status: { $ref: "#/components/schemas/LocalizationStatus" }
        sourceAssetId: { type: [string, "null"] }
        sourceTranscriptId: { type: [string, "null"] }
        transcriptVersion: { type: [integer, "null"] }
        sourceLanguage: { type: [string, "null"] }
        targetLanguage: { type: string }
        voice: { type: [string, "null"] }
        speakerVoices: { type: object, additionalProperties: { type: string } }
        keepOriginalAudio: { type: boolean }
        fileName: { type: [string, "null"] }
        videoStoragePath: { type: [string, "null"] }
        audioStoragePath: { type: [string, "null"] }
        captionsStoragePath: { type: [string, "null"] }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        durationMs: { type: integer }
        width: { type: integer }
        height: { type: integer }
        jobId: { type: [string, "null"] }
        error: { type: [object, "null"], additionalProperties: true }
        downloadUrl: { type: [string, "null"] }
        captionsUrl:
          type: [string, "null"]
          description: Short-lived signed URL for the localized SRT, when one was generated.
        corpusVersion: { type: integer }
        glossaryVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LocalizationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Localization" }

    LocalizationAccepted:
      type: object
      properties:
        localizationId: { type: string }
        jobId: { type: string }
        status: { type: string }

    GlossaryTerm:
      type: object
      properties:
        source: { type: string }
        target: { type: string }
        targetLanguage:
          type: string
          description: Short target-language code (`hi`). Empty means the term applies to any target.
      required: [source, target]

    Glossary:
      type: object
      properties:
        projectId: { type: string }
        sourceLanguage: { type: string }
        terms:
          type: array
          items: { $ref: "#/components/schemas/GlossaryTerm" }
        version: { type: integer }
        updatedAt: { type: [string, "null"], format: date-time }
      required: [projectId, sourceLanguage, terms, version]

    GlossaryUpdate:
      type: object
      properties:
        sourceLanguage: { type: string, default: en }
        terms:
          type: array
          items: { $ref: "#/components/schemas/GlossaryTerm" }
        expectedVersion:
          type: [integer, "null"]
          description: Optimistic concurrency; a mismatch returns 409.
      required: [terms]

    CorpusLanguagePair:
      type: object
      properties:
        sourceLanguage: { type: string }
        targetLanguage: { type: string }
      required: [sourceLanguage, targetLanguage]

    GlobalCorpus:
      type: object
      properties:
        version: { type: integer }
        pairs:
          type: array
          items: { $ref: "#/components/schemas/CorpusLanguagePair" }
      required: [version, pairs]

    AnalysisDimension:
      type: string
      description: |
        Reviewer dimensions. `truth_evidence` through `platform_fit` are core and
        always run; `audience_brand`, `emotional_impact`, and `conversion_cta` are
        opt-in. The trailing values are retired (kept so historical runs still
        deserialize; never requested or run).
      enum:
        - truth_evidence
        - clarity
        - pacing_retention
        - legal_safety
        - cultural_localization
        - platform_fit
        - audience_brand
        - emotional_impact
        - conversion_cta
        - structure_pacing
        - engagement_retention
        - audience_fit
        - brand_voice
        - seo_discoverability
        - visual_accessibility

    AnalysisRequest:
      type: object
      properties:
        dimensions:
          type: array
          description: |
            Extended dimensions to add. Core dimensions always run. The studio requests
            all nine active dimensions; an omitted list retains the six-core API default.
          items: { $ref: "#/components/schemas/AnalysisDimension" }
        platform: { type: string }
        includeVisualReview:
          type: boolean
          default: false
          description: |
            Reserved. Visual review happens inside the run: reviewers request a frame or a
            short clip through the FFmpeg visual-context tools when they are enabled
            (`REVIEW_VISUAL_TOOLS_ENABLED`), so there is no separate deep-review flow.
        transcriptVersion: { type: integer }

    AnalysisRunStatus:
      type: string
      enum: [queued, running, ready, partial_failure, failed]

    TokenUsage:
      type: object
      properties:
        input: { type: integer }
        output: { type: integer }

    AnalysisRun:
      type: object
      properties:
        analysisRunId: { type: string }
        jobId: { type: string }
        status: { $ref: "#/components/schemas/AnalysisRunStatus" }
        transcriptId: { type: string }
        sourceAssetId: { type: [string, "null"] }
        personaVersion: { type: [integer, "null"] }
        fanoutStrategy: { type: string }
        chunkCount: { type: integer }
        requestedDimensions:
          type: array
          items: { $ref: "#/components/schemas/AnalysisDimension" }
        completedDimensions:
          type: array
          items: { $ref: "#/components/schemas/AnalysisDimension" }
        overallScore:
          type: [number, "null"]
          description: Average quality of reported moments, not a whole-video grade.
        scoreByDimension:
          type: object
          additionalProperties: { type: number }
        findingCounts:
          type: object
          properties:
            none: { type: integer }
            low: { type: integer }
            medium: { type: integer }
            high: { type: integer }
            critical: { type: integer }
        modelConfigVersion: { type: string }
        promptVersion: { type: string }
        costEstimateUsd: { type: number }
        error: { type: [object, "null"], additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReviewerRunStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    ContextArtifactUrl:
      type: object
      required: [url]
      properties:
        url: { type: string }
        contentType: { type: string }
        expiresIn: { type: integer }

    ReviewerGroundingSource:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url: { type: string }

    ReviewerToolCall:
      type: object
      required: [tool]
      properties:
        tool:
          type: string
          enum: [extract_frame, cut_clip]
        timestampMs:
          type: integer
          description: The moment (ms) the reviewer asked to inspect.
        label:
          type: string
        mimeType: { type: string }
        contentPath:
          type: string
          description: |
            Cloud Storage object holding the fetched frame/clip. Empty when the call
            failed. Fetch it via the reviewer context endpoint for a signed URL.
        ok: { type: boolean }

    ReviewerRun:
      type: object
      properties:
        reviewerRunId: { type: string }
        dimension: { $ref: "#/components/schemas/AnalysisDimension" }
        status: { $ref: "#/components/schemas/ReviewerRunStatus" }
        findingCount: { type: integer }
        costEstimateUsd: { type: number }
        durationMs: { type: integer }
        model: { type: [string, "null"] }
        inputSegmentCount: { type: integer }
        toolCalls:
          type: array
          description: |
            Footage supplied to the reviewer: shared sampled frames and any frames/clips
            requested through its function-calling tools. Shared samples may reference
            the same project-scoped object across reviewers. Empty for transcript-only review.
          items: { $ref: "#/components/schemas/ReviewerToolCall" }
        groundingQueries:
          type: array
          description: |
            Web search queries the reviewer ran through Google Search grounding. Empty
            for every dimension except `truth_evidence`.
          items: { type: string }
        groundingSources:
          type: array
          description: Sources the grounded reviewer used to verify claims.
          items: { $ref: "#/components/schemas/ReviewerGroundingSource" }
        groundingSearchSuggestions:
          type: string
          description: |
            Google-provided "Search Suggestions" HTML. When non-empty it must be
            rendered as provided (Google's terms for Grounding with Google Search).
        tokenUsage: { $ref: "#/components/schemas/TokenUsage" }
        error: { type: [object, "null"], additionalProperties: true }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }

    Finding:
      type: object
      required: [dimension, score, confidence, severity, evidence, suggestion]
      properties:
        findingId: { type: string }
        dimension: { $ref: "#/components/schemas/AnalysisDimension" }
        reviewerRunId: { type: [string, "null"] }
        segmentId: { type: [string, "null"] }
        startMs: { type: integer }
        endMs: { type: integer }
        score: { type: integer, minimum: 1, maximum: 5 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        severity: { $ref: "#/components/schemas/Severity" }
        findingType: { type: string }
        evidence:
          type: object
          properties:
            quote:
              type: string
              description: Exact transcript excerpt, or empty for a grounded visual issue or omission.
            critique_and_reasoning:
              type: string
              description: Concise explanation of the observed problem or strength and its effect on the viewer.
        suggestion:
          type: string
          description: Specific edit or rewrite in the creator's voice. Empty only for a strength.
        citations:
          type: array
          items: { type: object, additionalProperties: true }

    HeatmapBin:
      type: object
      properties:
        binId: { type: string }
        dimension: { $ref: "#/components/schemas/AnalysisDimension" }
        startMs: { type: integer }
        endMs: { type: integer }
        score: { type: number }
        severity: { $ref: "#/components/schemas/Severity" }
        color: { type: string, enum: [green, yellow, orange, red] }
        findingIds: { type: array, items: { type: string } }

    # --- Realtime WebSocket frames -------------------------------------------------
    # The websocket carries snapshots and progress deltas. Payloads reuse the
    # Project/Job progress sub-objects so the client cache can patch directly.

    WsPing:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [ping] }

    WsSubscribeProject:
      type: object
      required: [type, projectId]
      properties:
        type: { type: string, enum: [subscribe.project] }
        projectId: { type: string }

    WsClientMessage:
      oneOf:
        - $ref: "#/components/schemas/WsSubscribeProject"
        - $ref: "#/components/schemas/WsUnsubscribeProject"
        - $ref: "#/components/schemas/WsPing"

    WsUnsubscribeProject:
      type: object
      required: [type, projectId]
      properties:
        type: { type: string, enum: [unsubscribe.project] }
        projectId: { type: string }

    ProjectProgress:
      type: object
      description: Project.progress sub-object (also embedded in Project).
      properties:
        stage: { type: [string, "null"] }
        percent: { type: integer }
        message: { type: [string, "null"] }

    JobProgress:
      type: object
      description: Job.progress sub-object (also embedded in Job).
      properties:
        percent: { type: integer }
        step: { type: string }
        message: { type: string }

    WsSnapshotProject:
      type: object
      required: [type, projectId, status]
      properties:
        type: { type: string, enum: [snapshot.project] }
        projectId: { type: string }
        status:
          type: string
          enum: [draft, uploading, processing, ready, partial_failure, failed, archived]
        progress: { $ref: "#/components/schemas/ProjectProgress" }
        job:
          type: [object, "null"]
          properties:
            jobId: { type: string }
            type: { type: string }
            status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
            progress: { $ref: "#/components/schemas/JobProgress" }

    WsEventProjectProgress:
      type: object
      required: [type, projectId, status]
      properties:
        type: { type: string, enum: [project.progress] }
        projectId: { type: string }
        status:
          type: string
          enum: [draft, uploading, processing, ready, partial_failure, failed, archived]
        progress: { $ref: "#/components/schemas/ProjectProgress" }

    WsEventJobProgress:
      type: object
      required: [type, projectId, jobId]
      properties:
        type: { type: string, enum: [job.progress] }
        projectId: { type: string }
        jobId: { type: string }
        jobType: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progress: { $ref: "#/components/schemas/JobProgress" }
        error: { type: [object, "null"], additionalProperties: true }

    WsEventTranscriptReady:
      type: object
      required: [type, projectId, transcriptId]
      properties:
        type: { type: string, enum: [transcript.ready] }
        projectId: { type: string }
        transcriptId: { type: string }
        jobId: { type: [string, "null"] }
        durationMs: { type: integer }
        language: { type: string }

    WsEventAnalysisProgress:
      type: object
      required: [type, projectId, analysisRunId]
      properties:
        type: { type: string, enum: [analysis.progress] }
        projectId: { type: string }
        analysisRunId: { type: string }
        status: { $ref: "#/components/schemas/AnalysisRunStatus" }
        completedDimensions:
          type: array
          items: { $ref: "#/components/schemas/AnalysisDimension" }
        reviewerStatuses:
          type: array
          description: One entry per reviewer, as known at emit time.
          items:
            type: object
            required: [dimension, status]
            properties:
              dimension: { $ref: "#/components/schemas/AnalysisDimension" }
              status: { $ref: "#/components/schemas/ReviewerRunStatus" }
              findingCount: { type: [integer, "null"] }
              error: { type: [string, "null"] }

    WsEventAnalysisReady:
      type: object
      required: [type, projectId, analysisRunId]
      properties:
        type: { type: string, enum: [analysis.ready] }
        projectId: { type: string }
        analysisRunId: { type: string }
        status: { $ref: "#/components/schemas/AnalysisRunStatus" }
        overallScore: { type: [number, "null"] }
        findingCounts:
          type: object
          properties:
            none: { type: integer }
            low: { type: integer }
            medium: { type: integer }
            high: { type: integer }
            critical: { type: integer }

    WsError:
      type: object
      required: [type, code, message]
      properties:
        type: { type: string, enum: [error] }
        code: { type: string }
        message: { type: string }

    WsPong:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [pong] }

    WsServerMessage:
      oneOf:
        - { $ref: "#/components/schemas/WsSnapshotProject" }
        - { $ref: "#/components/schemas/WsEventProjectProgress" }
        - { $ref: "#/components/schemas/WsEventJobProgress" }
        - { $ref: "#/components/schemas/WsEventTranscriptReady" }
        - { $ref: "#/components/schemas/WsEventAnalysisProgress" }
        - { $ref: "#/components/schemas/WsEventAnalysisReady" }
        - { $ref: "#/components/schemas/WsError" }
        - { $ref: "#/components/schemas/WsPong" }

