openapi: 3.1.0
info:
  title: Creator Helper Studio API
  version: "0.1.0"
  description: |
    Frozen contract between web and backend. Generate the TypeScript client from this file.
servers:
  - url: http://localhost:8080
    description: Local
  - url: https://api.example.com/v1
    description: Deployed

security:
  - FirebaseBearer: []

paths:
  /api/projects/{projectId}/packaging/listing:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: Read saved editable YouTube metadata
      responses:
        "200":
          description: Listing or null; stale indicates a different active video/transcript
          content:
            application/json:
              schema: { anyOf: [{ $ref: "#/components/schemas/PackagingListing" }, { type: "null" }] }
    put:
      summary: Save edited title, description and tags
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingFields" }
      responses:
        "200":
          description: Saved listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackagingListing" }
        "409": { description: Generation is running or source changed }
  /api/projects/{projectId}/packaging/listing/generate:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Generate grounded metadata with optional creator-library style evidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackagingBrief" }
      responses:
        "202":
          description: Generation job accepted; poll listing and job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackagingAccepted" }
  /api/projects/{projectId}/visual-inserts:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: Read contextual visual insert suggestions and their renders
      responses:
        "200":
          description: Suggestions with short-lived preview URLs and render allowance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisualInsertList" }
  /api/projects/{projectId}/visual-inserts/suggest:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Suggest up to three chart, callout or illustrative footage inserts
      description: Reads the active timestamped transcript, sampled footage and creator context. No video generation occurs here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackagingBrief" }
      responses:
        "202":
          description: Suggestion job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackagingAccepted" }
  /api/projects/{projectId}/visual-inserts/{insertId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: insertId, in: path, required: true, schema: { type: string } }
    delete:
      summary: Delete a suggestion and its project-scoped media
      description: Does not refund reserved paid render slots.
      responses:
        "204": { description: Deleted }
        "409": { description: Render is running }
  /api/projects/{projectId}/visual-inserts/{insertId}/render:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: insertId, in: path, required: true, schema: { type: string } }
    post:
      summary: Render one six-second visual insert
      description: Charts/callouts use exact typography with FFmpeg; illustrative footage uses one Veo 3.1 Fast request in us-central1. Paid attempts are atomically capped per project and reservations survive failure/deletion. Existing renders are reused. A saved upstream operation is polled on retry, never resubmitted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenderVisualInsertRequest" }
      responses:
        "202":
          description: Render job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackagingAccepted" }
        "409": { description: Source changed, paid allowance exhausted or ambiguous upstream submission }
  /api/creator-library:
    get:
      summary: Read the active imported library or most recently synced channel
      description: Returns bounded passages, thumbnail nodes, indexing coverage and an approximate PCA map. Never calls a model. Raw vectors are private.
      responses:
        "200":
          description: Creator library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorLibrary" }
  /api/creator-library/index:
    post:
      summary: Index the next bounded batch with Gemini Embedding 2
      description: Explicit, resumable indexing; at most 16 model calls per request and 200 embedding calls per user per UTC day, including searches. Unchanged chunks reuse cached vectors. No automatic paid loop.
      responses:
        "200":
          description: Updated coverage and map; errorMessage describes a partial provider failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorLibrary" }
        "429": { description: Daily embedding allowance exhausted }
  /api/creator-library/search:
    post:
      summary: Search creator passages and thumbnails by meaning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Ranked evidence; lexical fallback when indexing or model is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorLibrarySearch" }
        "429": { description: Daily embedding allowance exhausted }

  /api/healthz:
    get:
      security: []
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /api/readyz:
    get:
      security: []
      summary: Readiness check
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }

  /api/demo/session:
    post:
      security: []
      summary: Start a passwordless read-only demo session
      description: |
        Ensures the shared demo Auth user exists and returns a short-lived Firebase custom
        token for it. The demo UID is read-only, so every mutating request it makes is still
        rejected with 403. Disabled (404) unless `DEMO_USER_UID` is configured.
      responses:
        "200":
          description: Custom token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/me:
    get:
      summary: Current application profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Delete the current account and all owned data
      description: |
        Permanently deletes the user's Firestore subtree and the Firebase Auth
        account. This cannot be undone.
      responses:
        "204":
          description: Account deleted
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/me/avatar:
    put:
      summary: Save the user's Humation avatar
      description: |
        Replaces the avatar stored on the user document. The avatar is a deterministic
        seed plus optional per-slot part selections and color overrides, rendered locally.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvatarState" }
      responses:
        "200":
          description: Saved avatar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarState" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding:
    get:
      summary: Read onboarding progress
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }
    put:
      summary: Save a partial onboarding step
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingStep" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }

  /api/onboarding/complete:
    post:
      summary: Generate and save the initial persona
      responses:
        "200":
          description: Persona created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonaRef" }

  /api/onboarding/research:
    post:
      summary: Research the creator from public links and prefill the persona form
      description: |
        One grounded Gemini call (Grounding with Google Search) reads the creator's public
        profile links and drafts their onboarding answers. The links and grounding metadata are
        stored on the user document under `onboarding`. The client must render
        `searchSuggestions` exactly as returned and show `sources` (Google Search grounding terms).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingResearchRequest" }
      responses:
        "200":
          description: Prefilled answers plus grounding provenance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingResearch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/persona:
    get:
      summary: Read current persona
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Persona" }
    patch:
      summary: Apply a user-approved persona edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, expectedVersion]
              properties:
                content: { type: string }
                expectedVersion: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Persona" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/projects:
    get:
      summary: List owned projects
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/PageToken" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  nextPageToken: { type: [string, "null"] }
    post:
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProject" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /api/projects/{projectId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: Get project summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update project metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                sourceDraftId:
                  type: [string, "null"]
                  description: |
                    Link/unlink the script source (video projects only; must point at a
                    draft project). Explicit null clears the link; omitted leaves it
                    untouched.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    delete:
      summary: Delete a project and all of its data
      description: |
        Permanently removes every Cloud Storage object under the project prefix (source video,
        transcript JSON, VTT/SRT captions, derived media) and the whole Firestore subtree
        (assets, jobs, transcripts + segments). Cannot be undone. The delete is
        synchronous, so a successful response means the data is gone.
      responses:
        "204":
          description: Deleted, no content

  /api/projects/{projectId}/upload-session:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Create a direct Cloud Storage upload session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadSessionRequest" }
      responses:
        "201":
          description: Upload session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }

  /api/projects/{projectId}/assets:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List project assets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetList" }

  /api/projects/{projectId}/assets/{assetId}/complete:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AssetId" }
    post:
      summary: Confirm a client upload
      description: |
        Verifies the object exists in Cloud Storage, marks the asset uploaded, and queues the
        first pipeline job (transcription). Idempotent per asset.
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/projects/{projectId}/assets/{assetId}/download-url:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AssetId" }
    get:
      summary: Get a short-lived download/playback URL for an asset
      description: |
        Returns a short-lived signed read URL so the browser can stream the source video
        directly from Cloud Storage.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadUrl" }

  /api/projects/{projectId}/revisions:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List source-video revisions, newest first
      description: |
        A project keeps one video but may hold several revisions of it. Each upload creates
        a new source revision; the newest (or explicitly activated) one is the project's
        active source. Revisions are never overwritten, so previous transcripts and
        analyses stay attributable to the revision they were built from. Uploading is
        unchanged (`POST /upload-session` then `POST /assets/{id}/complete`); the new
        revision transcodes automatically and the caller may then re-run analysis.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionList" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/revisions/{assetId}/activate:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AssetId" }
    post:
      summary: Make an earlier revision the project's active video
      description: |
        Points the project back at this revision. If the revision already has a saved
        transcript, that transcript becomes the active one; otherwise a fresh
        transcription run is queued and `jobId` is returned. Existing transcripts and
        analysis runs are never deleted, so switching between revisions loses no work.
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionActivation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/draft:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: Get the project's versioned draft
      description: |
        Returns the single draft document for a draft project: the brief, the
        ordered blocks, each block's version history, and the chat messages.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Save client-side draft edits
      description: |
        Persists the title and blocks the creator edited in the studio. The body
        is the full block set (a replace, not a patch), so it may contain block
        ids the server has not seen yet — the client owns block creation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveDraftRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }

  /api/projects/{projectId}/draft/context:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: What the last generation retrieved from the creator's channel
      description: |
        Returns the style evidence (retrieved past videos, style signals, and audience profile) the
        draft writer used on the last generation. Empty (`available: false`) when no channel content
        has been synced. Read-only, for the studio's "Style evidence" panel.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorContext" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/draft/generate:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Generate the first draft from the brief
      description: |
        Calls the writing model with the stored brief (optionally overridden in
        the body) and replaces the blocks with a fresh first draft. Every block
        starts with one version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateDraftRequest" }
      responses:
        "200":
          description: Generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }

  /api/projects/{projectId}/draft/assist:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Chat with the draft, applying versioned edits
      description: |
        Sends an instruction to the writing partner. The reply is appended to the
        chat and any proposed rewrites become new versions on their blocks, so
        the previous wording is always recovered from the version history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistDraftRequest" }
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }

  /api/projects/{projectId}/draft/suggest:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Suggest replacements for a selected span
      description: |
        Returns drop-in replacements for a selected span so the client can wrap it
        in an inline variant. Unlike `/draft/assist` this does not modify the
        stored draft.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuggestDraftRequest" }
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuggestDraftResponse" }

  /api/jobs/{jobId}:
    parameters:
      - { $ref: "#/components/parameters/JobId" }
    get:
      summary: Get job status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /api/jobs/{jobId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/JobId" }
    post:
      summary: Cancel a queued or running job
      description: |
        Terminal jobs (succeeded/failed/cancelled) return 409 JOB_NOT_CANCELLABLE.
      responses:
        "200":
          description: Cancelled job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/ws:
    get:
      # WebSocket upgrade. Browsers cannot set Authorization headers on a
      # WebSocket, so the Firebase ID token travels as `?token=`; the server
      # verifies it exactly like HTTP bearer auth before accepting the socket.
      # In prod the socket targets the Cloud Run service URL directly (Firebase
      # Hosting rewrites do not proxy WebSocket upgrades); NEXT_PUBLIC_WS_BASE_URL
      # carries that base. Cloud Run request timeout bounds connection lifetime —
      # the client reconnects (and refreshes its token) automatically.
      summary: WebSocket for project realtime events
      description: |
        Replaces the retired SSE stream. One socket per browser session; the client
        subscribes per project after connecting. Message shapes are in
        `WsClientMessage` / `WsServerMessage` (also see contracts/events.md,
        section "Realtime WebSocket protocol").
      x-websocket-protocol: |
        1. Connect: GET {WS_BASE}/api/ws?token=<firebaseIdToken>
           - The upgrade is accepted, then closed with code 4401 if the token is
             missing/expired. No data is sent on an unauthenticated socket; the
             client reconnects with a fresh token. (A 401 denial response is not
             used: Starlette does not mark the handshake complete for it.)
        2. Client → server: {"type":"subscribe.project","projectId":"..."}
           - Ownership is verified (404 semantics on mismatch); failure closes with
             {"type":"error","code":"..."}.
        3. Server → client: {"type":"snapshot.project", ...ProjectState} — the
           full current state immediately on subscribe, so the client never
           needs a separate HTTP fetch to prime progress UI.
        4. Server → client: typed events (ProjectProgressEvent, JobProgressEvent,
           TranscriptReadyEvent, AnalysisProgressEvent, ReviewerOutcomeEvent,
           AnalysisReadyEvent) as the corresponding Firestore writes happen.
        5. Either side may send {"type":"ping"}; the peer answers {"type":"pong"}.
        6. Server closes when the project is idle or at the platform timeout;
           the client reconnects and resubscribes.
      responses:
        "101":
          description: WebSocket upgrade (protocol messages as defined above)

  /api/projects/{projectId}/transcript:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: Get transcript metadata and segments
      parameters:
        - name: version
          in: query
          required: false
          description: A specific saved transcript generation; defaults to the active one.
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transcript" }
    put:
      summary: Save edited transcript segments as a new active version
      description: |
        Backs the transcript editor's Save action. Persists the submitted segments as a new
        saved version and makes it the active transcript. Runs no speech-to-text, so it is
        cheap and synchronous. Empty segments are dropped and timings are clamped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranscriptUpdate" }
      responses:
        "200":
          description: The new active transcript
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transcript" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/transcript/versions:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List saved transcript versions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranscriptVersionList" }

  /api/projects/{projectId}/transcript/retranscribe:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Re-run transcription for the project's source video
      description: |
        Queues a fresh transcribe job for the project's source video and returns it. Unlike
        completing the upload (which is idempotent per asset), this always starts a new run, so
        a finished transcript can be regenerated.
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/transcript/segments/{segmentId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: segmentId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get one transcript segment
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranscriptSegment" }

  /api/caption-presets:
    get:
      summary: List caption style presets
      description: |
        Presets the web customizer mirrors. The same definitions drive the server-side ASS
        builder, so the on-screen preview and the rendered video cannot drift.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptionPresetList" }

  /api/projects/{projectId}/captions/renders:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List caption renders, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptionRenderList" }
    post:
      summary: Burn a styled transcript onto the source video
      description: |
        Queues a `caption_render` job. FFmpeg overlays the transcript (the active version, or
        `transcriptVersion` when given) as a styled ASS track using the bundled fonts. The
        burned MP4 and the generated ASS are stored under the project prefix, so project and
        account deletion remove them with no extra wiring.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptionRenderRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptionRenderAccepted" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/captions/renders/{captionRenderId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: captionRenderId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get one caption render
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptionRender" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a caption render and its media
      responses:
        "204": { description: Deleted }

  /api/projects/{projectId}/captions/renders/{captionRenderId}/download-url:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: captionRenderId, in: path, required: true, schema: { type: string } }
    get:
      summary: Signed download URL for a ready captioned video
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadUrl" }
        "400":
          description: The render is not ready yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/localization-voices:
    get:
      summary: List dubbing languages and voices
      description: |
        The languages the dubbing pipeline can synthesize and the voices available for each.
        The web client hydrates its language/voice pickers from this, so the UI and the worker
        cannot drift. English is the first fully supported target; other languages share the
        same catalog shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalizationVoiceList" }

  /api/glossaries:
    get:
      summary: The bundled global localization corpus
      description: |
        The version of the global corpus and the source→target language pairs it covers:
        glossary terms plus the hand-curated trap list. The localization worker applies
        these during the Gemini adaptation pass.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalCorpus" }

  /api/projects/{projectId}/glossary:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: Read the project glossary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Glossary" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Replace the project glossary
      description: |
        Replaces the terms and bumps the version. Send `expectedVersion` for optimistic
        concurrency; a stale version returns 409. A localization snapshots the applicable
        terms (and the version) when it is created, so a later edit cannot change a dub that
        is already running or finished.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlossaryUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Glossary" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The glossary changed since it was loaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/{projectId}/localizations:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List localizations (dubs), newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalizationList" }
    post:
      summary: Dub the source video into a target language
      description: |
        Queues a `dub` job. The worker translates the transcript when the source language
        differs from `targetLanguage`, synthesizes one Text-to-Speech take per segment, duration-
        normalizes each take to its timestamp window, and muxes the resulting track onto the
        source video with FFmpeg. The dubbed MP4 and the dubbed audio are stored under the
        project prefix (`renders/dubs/`), so project and account deletion remove them with no
        extra wiring.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalizationRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalizationAccepted" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/localizations/{localizationId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: localizationId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get one localization (dub)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Localization" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a localization and its media
      responses:
        "204": { description: Deleted }

  /api/projects/{projectId}/localizations/{localizationId}/download-url:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: localizationId, in: path, required: true, schema: { type: string } }
    get:
      summary: Signed download URL for a ready dubbed video
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadUrl" }
        "400":
          description: The dub is not ready yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/projects/{projectId}/thumbnails:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List thumbnail concepts, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThumbnailConceptList" }
    post:
      summary: Plan and render a batch of grounded thumbnail concepts
      description: |
        Queues one `thumbnail` job. A planner reads the transcript, the reviewer findings, the
        title and the creator persona, and writes a distinct concept per thumbnail: a short
        headline, a visual direction, the timestamp of the moment to take the presenter's face
        from, and a rationale that cites the evidence. FFmpeg pulls reference frames from the
        source video and Gemini image generation ("Nano Banana") renders each concept around the
        real person; a cheap multimodal pass then critiques legibility, promise-vs-content and
        platform fit. Records live under the project subtree and images under the project object
        prefix, so project and account deletion remove them with no extra wiring.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateThumbnailsRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThumbnailBatchAccepted" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The project has reached its image-generation budget
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/{projectId}/thumbnails/{thumbnailId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: thumbnailId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get one thumbnail concept with its versions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThumbnailConcept" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a thumbnail concept and its images
      responses:
        "204": { description: Deleted }

  /api/projects/{projectId}/thumbnails/{thumbnailId}/revise:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: thumbnailId, in: path, required: true, schema: { type: string } }
    post:
      summary: Conversationally edit a concept's active image
      description: |
        Queues a `thumbnail` job in `revise` mode. The active image is fed back to Gemini image
        generation with the creator's instruction, and the result is appended as a new version;
        no earlier image is overwritten.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviseThumbnailRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThumbnailRevisionAccepted" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The concept has no image to edit yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/{projectId}/thumbnails/{thumbnailId}/apply:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: thumbnailId, in: path, required: true, schema: { type: string } }
    post:
      summary: Apply a concept as the project's packaging promise
      description: |
        Writes the concept's headline and rationale to `project.thumbnailConcept`, which the
        reviewers already read when judging a hook. Marks this concept `isApplied` and clears
        the flag on the others.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThumbnailConcept" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The concept has no headline yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/{projectId}/thumbnails/{thumbnailId}/download-url:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: thumbnailId, in: path, required: true, schema: { type: string } }
    get:
      summary: Signed download URL for a concept's active image
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadUrl" }
        "400":
          description: The thumbnail is not ready yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/{projectId}/thumbnails/regenerate:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Re-render selected concepts as fresh versions
      description: |
        Queues one `thumbnail` job in `regenerate` mode. Each selected concept keeps its
        headline, rationale and source moment, but is re-rendered as a new version — a fresh
        take on the same idea, for a bulk "redo".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThumbnailSelectionRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThumbnailBatchAccepted" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The project has reached its image-generation budget
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/{projectId}/thumbnails/download:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Download selected concepts as a zip
      description: |
        Zips the active image of each selected concept and returns it as
        `application/zip`. Used by the studio's bulk download; the browser fetches it with
        auth headers and saves the blob.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThumbnailSelectionRequest" }
      responses:
        "200":
          description: A zip of the selected thumbnails
          content:
            application/zip:
              schema: { type: string, format: binary }

  /api/projects/{projectId}/analysis:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List analysis runs, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AnalysisRun" }
    post:
      summary: Start multi-reviewer analysis
      description: |
        Queues a tier-1 (transcript) multi-reviewer run over the project's active
        transcript. The six core dimensions always run; `dimensions` may add any of
        the extended ones. Returns 202 with the analysis run and the job that
        drives it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalysisRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysisRunId: { type: string }
                  jobId: { type: string }
                  status: { type: string }
        "409":
          description: The project's cost cap is exhausted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/{projectId}/analysis/{analysisRunId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AnalysisRunId" }
    get:
      summary: Get analysis summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisRun" }

  /api/projects/{projectId}/analysis/{analysisRunId}/reviewers:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AnalysisRunId" }
    get:
      summary: Per-reviewer status and cost
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReviewerRun" }

  /api/projects/{projectId}/analysis/{analysisRunId}/reviewers/{reviewerRunId}/context/{index}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AnalysisRunId" }
      - { name: reviewerRunId, in: path, required: true, schema: { type: string } }
      - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
    get:
      summary: Signed URL for one reviewer-fetched frame or clip
      description: |
        Returns a short-lived signed URL for one frame/clip the reviewer fetched through
        the footage tools. The client requests this lazily, only when the user expands a
        reviewer's evidence, so reviewers-list polling stays cheap.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextArtifactUrl" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/{projectId}/analysis/{analysisRunId}/findings:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AnalysisRunId" }
      - { name: dimension, in: query, schema: { type: string } }
      - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
      - { name: startMs, in: query, schema: { type: integer, minimum: 0 } }
      - { name: endMs, in: query, schema: { type: integer, minimum: 0 } }
    get:
      summary: List findings
      description: |
        `startMs`/`endMs` select findings that overlap the given window. Filters
        combine with AND.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Finding" }

  /api/projects/{projectId}/analysis/{analysisRunId}/heatmap:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AnalysisRunId" }
    get:
      summary: Get UI-ready heatmap bins
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bins:
                    type: array
                    items: { $ref: "#/components/schemas/HeatmapBin" }

  /api/projects/{projectId}/artifacts:
    x-status: planned
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List artifacts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Artifact" }
    post:
      summary: Start artifact generation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtifactRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifactId: { type: string }
                  jobId: { type: string }

  /api/projects/{projectId}/chat/threads/{threadId}/messages:
    x-status: planned
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: threadId, in: path, required: true, schema: { type: string } }
    get:
      summary: List messages
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ChatMessage" }
    post:
      summary: Send a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                stream: { type: boolean, default: true }
      responses:
        "200":
          description: Assistant reply (or stream)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }

  /api/connections:
    get:
      summary: List connected platform accounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/connections/{platform}/oauth/start:
    post:
      summary: Start OAuth for a platform
      description: |
        Returns the provider authorization URL and the opaque `state` the callback will check.
        For YouTube the URL sets `prompt=select_account`, so Google shows the account chooser
        and the creator picks which Gmail account to connect from.
      parameters:
        - { name: platform, in: path, required: true, schema: { type: string, enum: [youtube] } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthStartRequest" }
      responses:
        "201":
          description: Authorization URL created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthStartResponse" }
        "400": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/connections/{platform}/oauth/callback:
    get:
      security: []
      summary: Provider OAuth callback (browser redirect)
      description: |
        Google redirects the browser here after consent. Unauthenticated by design: the
        single-use server-side `state` is the proof of identity. Always responds with a 302
        back into the web app, carrying `youtube=connected|error`.
      parameters:
        - { name: platform, in: path, required: true, schema: { type: string, enum: [youtube] } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: false, schema: { type: [string, "null"] } }
        - { name: error, in: query, required: false, schema: { type: [string, "null"] } }
      responses:
        "302":
          description: Redirect back to the web app

  /api/connections/{connectionId}/sync:
    post:
      summary: Refresh a connected channel's stats
      parameters:
        - { $ref: "#/components/parameters/ConnectionId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/connections/{connectionId}:
    delete:
      summary: Revoke and delete a connection
      parameters:
        - { $ref: "#/components/parameters/ConnectionId" }
      responses:
        "204": { description: Connection removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/connections/{connectionId}/content:
    get:
      summary: A connected channel's read-back content profile (style signals + top/recent videos)
      parameters:
        - { $ref: "#/components/parameters/ConnectionId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelContentProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/connections/{connectionId}/content/sync:
    post:
      summary: Read the channel's existing videos back for style/RAG analysis
      description: |
        Lists the channel's uploads playlist (cheap: ~1 quota unit per 50 videos) and stores a
        compact copy of each video under the connection. Draft generation then retrieves the most
        relevant past videos as style evidence. Reads the creator's own channel data only.
      parameters:
        - { $ref: "#/components/parameters/ConnectionId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelContentProfile" }
        "400": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/connections/{connectionId}/audience:
    get:
      summary: The connected channel's YouTube Analytics profile (summary, demographics, traffic)
      parameters:
        - { $ref: "#/components/parameters/ConnectionId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AudienceProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/connections/{connectionId}/audience/sync:
    post:
      summary: Read the channel's YouTube Analytics for the audience profile
      description: |
        Queries YouTube Analytics (last `CHANNEL_ANALYTICS_DAYS` days) for the channel summary,
        viewer demographics, traffic sources, top countries, and top videos, and stores them on the
        connection. Draft generation includes this audience profile as context.
      parameters:
        - { $ref: "#/components/parameters/ConnectionId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AudienceProfile" }
        "400": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/publishes:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List publish attempts for a project, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Publish a project to a connected channel
      description: |
        Uploads the chosen video (source, burned-caption render, or dub), sets the chosen
        thumbnail version, and uploads an SRT/VTT caption track built from the transcript.
        Runs asynchronously; poll `GET /jobs/{jobId}` or the project's publish list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishAccepted" }
        "400": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/publishes/{publishId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/PublishId" }
    get:
      summary: Get one publish attempt
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publish" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a publish record (does not delete the YouTube video)
      responses:
        "204": { description: Publish record removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/publishes/{publishId}/retry:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/PublishId" }
    post:
      summary: Re-queue a failed publish
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/schedules:
    get:
      summary: Every scheduled slot across the caller's projects, oldest first
      description: |
        Powers the content calendar. Optional `start`/`end` bound the window; both are
        ISO datetimes. A schedule may link to a publish attempt (`publishId`); editing a
        linked schedule's `scheduledAt` also moves the publish's `publishAt`.
      parameters:
        - name: start
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: end
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/projects/{projectId}/schedules:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List a project's calendar slots, oldest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Plan a calendar slot for a project
      description: |
        `publishId` links the slot to a publish attempt; rescheduling the slot later also
        moves the publish's `publishAt`. Send `publishId: null` to keep it a rough plan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/schedules/{scheduleId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/ScheduleId" }
    patch:
      summary: Edit a calendar slot (reschedule, rename, relink, cancel)
      description: |
        Only the fields sent are changed; `publishId: null` unlinks the publish. Moving
        `scheduledAt` on a linked slot also moves the publish's `publishAt`, unless that
        publish already went out (409 SCHEDULE_PUBLISH_FINISHED).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Remove a calendar slot (does not touch a linked publish)
      responses:
        "204": { description: Slot removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

