openapi: 3.1.0
info:
  title: Creator Helper Studio API
  version: "0.1.0"
  description: |
    Frozen contract between web and backend. Generate the TypeScript client from this file.
servers:
  - url: http://localhost:8080
    description: Local
  - url: https://api.example.com/v1
    description: Deployed

security:
  - FirebaseBearer: []

paths:
  /api/healthz:
    get:
      security: []
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /api/readyz:
    get:
      security: []
      summary: Readiness check
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }

  /api/me:
    get:
      summary: Current application profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Delete the current account and all owned data
      description: |
        Permanently deletes the user's Firestore subtree and the Firebase Auth
        account. This cannot be undone.
      responses:
        "204":
          description: Account deleted
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/me/avatar:
    put:
      summary: Save the user's Humation avatar
      description: |
        Replaces the avatar stored on the user document. The avatar is a deterministic
        seed plus optional per-slot part selections and color overrides, rendered locally.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvatarState" }
      responses:
        "200":
          description: Saved avatar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarState" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding:
    get:
      summary: Read onboarding progress
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }
    put:
      summary: Save a partial onboarding step
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingStep" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }

  /api/onboarding/complete:
    post:
      summary: Generate and save the initial persona
      responses:
        "200":
          description: Persona created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonaRef" }

  /api/persona:
    get:
      summary: Read current persona
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Persona" }
    patch:
      summary: Apply a user-approved persona edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, expectedVersion]
              properties:
                content: { type: string }
                expectedVersion: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Persona" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/projects:
    get:
      summary: List owned projects
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/PageToken" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  nextPageToken: { type: [string, "null"] }
    post:
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProject" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /api/projects/{projectId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: Get project summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update project metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    delete:
      summary: Delete a project and all of its data
      description: |
        Permanently removes every Cloud Storage object under the project prefix (source video,
        transcript JSON, VTT/SRT captions, derived media) and the whole Firestore subtree
        (assets, jobs, transcripts + segments). Cannot be undone. The delete is
        synchronous, so a successful response means the data is gone.
      responses:
        "204":
          description: Deleted, no content

  /api/projects/{projectId}/upload-session:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Create a direct Cloud Storage upload session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadSessionRequest" }
      responses:
        "201":
          description: Upload session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }

  /api/projects/{projectId}/assets:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List project assets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetList" }

  /api/projects/{projectId}/assets/{assetId}/complete:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AssetId" }
    post:
      summary: Confirm a client upload
      description: |
        Verifies the object exists in Cloud Storage, marks the asset uploaded, and queues the
        first pipeline job (transcription). Idempotent per asset.
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/projects/{projectId}/assets/{assetId}/download-url:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AssetId" }
    get:
      summary: Get a short-lived download/playback URL for an asset
      description: |
        Returns a short-lived signed read URL so the browser can stream the source video
        directly from Cloud Storage.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadUrl" }

  /api/jobs/{jobId}:
    parameters:
      - { $ref: "#/components/parameters/JobId" }
    get:
      summary: Get job status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /api/jobs/{jobId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/JobId" }
    post:
      summary: Cancel a queued or running job
      description: |
        Terminal jobs (succeeded/failed/cancelled) return 409 JOB_NOT_CANCELLABLE.
      responses:
        "200":
          description: Cancelled job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/ws:
    get:
      # WebSocket upgrade. Browsers cannot set Authorization headers on a
      # WebSocket, so the Firebase ID token travels as `?token=`; the server
      # verifies it exactly like HTTP bearer auth before accepting the socket.
      # In prod the socket targets the Cloud Run service URL directly (Firebase
      # Hosting rewrites do not proxy WebSocket upgrades); NEXT_PUBLIC_WS_BASE_URL
      # carries that base. Cloud Run request timeout bounds connection lifetime —
      # the client reconnects (and refreshes its token) automatically.
      summary: WebSocket for project realtime events
      description: |
        Replaces the retired SSE stream. One socket per browser session; the client
        subscribes per project after connecting. Message shapes are in
        `WsClientMessage` / `WsServerMessage` (also see contracts/events.md,
        section "Realtime WebSocket protocol").
      x-websocket-protocol: |
        1. Connect: GET {WS_BASE}/api/ws?token=<firebaseIdToken>
           - The upgrade is accepted, then closed with code 4401 if the token is
             missing/expired. No data is sent on an unauthenticated socket; the
             client reconnects with a fresh token. (A 401 denial response is not
             used: Starlette does not mark the handshake complete for it.)
        2. Client → server: {"type":"subscribe.project","projectId":"..."}
           - Ownership is verified (404 semantics on mismatch); failure closes with
             {"type":"error","code":"..."}.
        3. Server → client: {"type":"snapshot.project", ...ProjectState} — the
           full current state immediately on subscribe, so the client never
           needs a separate HTTP fetch to prime progress UI.
        4. Server → client: typed events (ProjectProgressEvent, JobProgressEvent,
           TranscriptReadyEvent, AnalysisProgressEvent, ReviewerOutcomeEvent,
           AnalysisReadyEvent) as the corresponding Firestore writes happen.
        5. Either side may send {"type":"ping"}; the peer answers {"type":"pong"}.
        6. Server closes when the project is idle or at the platform timeout;
           the client reconnects and resubscribes.
      responses:
        "101":
          description: WebSocket upgrade (protocol messages as defined above)

  /api/projects/{projectId}/transcript:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: Get transcript metadata and segments
      parameters:
        - name: version
          in: query
          required: false
          description: A specific saved transcript generation; defaults to the active one.
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transcript" }

  /api/projects/{projectId}/transcript/versions:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List saved transcript versions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranscriptVersionList" }

  /api/projects/{projectId}/transcript/retranscribe:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Re-run transcription for the project's source video
      description: |
        Queues a fresh transcribe job for the project's source video and returns it. Unlike
        completing the upload (which is idempotent per asset), this always starts a new run, so
        a finished transcript can be regenerated.
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{projectId}/transcript/segments/{segmentId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: segmentId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get one transcript segment
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranscriptSegment" }

  /api/projects/{projectId}/analysis:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List analysis runs, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AnalysisRun" }
    post:
      summary: Start multi-reviewer analysis
      description: |
        Queues a tier-1 (transcript) multi-reviewer run over the project's active
        transcript. The six core dimensions always run; `dimensions` may add any of
        the extended ones. Returns 202 with the analysis run and the job that
        drives it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalysisRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysisRunId: { type: string }
                  jobId: { type: string }
                  status: { type: string }
        "409":
          description: The project's cost cap is exhausted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/{projectId}/analysis/{analysisRunId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AnalysisRunId" }
    get:
      summary: Get analysis summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisRun" }

  /api/projects/{projectId}/analysis/{analysisRunId}/reviewers:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AnalysisRunId" }
    get:
      summary: Per-reviewer status and cost
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReviewerRun" }

  /api/projects/{projectId}/analysis/{analysisRunId}/findings:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AnalysisRunId" }
      - { name: dimension, in: query, schema: { type: string } }
      - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
      - { name: startMs, in: query, schema: { type: integer, minimum: 0 } }
      - { name: endMs, in: query, schema: { type: integer, minimum: 0 } }
    get:
      summary: List findings
      description: |
        `startMs`/`endMs` select findings that overlap the given window. Filters
        combine with AND.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Finding" }

  /api/projects/{projectId}/analysis/{analysisRunId}/heatmap:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AnalysisRunId" }
    get:
      summary: Get UI-ready heatmap bins
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bins:
                    type: array
                    items: { $ref: "#/components/schemas/HeatmapBin" }

  /api/projects/{projectId}/analysis/{analysisRunId}/segment-review:
    x-status: planned
    description: |
      Tier-2 deep review of one time range (multimodal clip + sampled frames). Needs
      the FFmpeg media worker (`docs/technical-design/diagrams.md` section 7).
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/AnalysisRunId" }
    post:
      summary: Deep-review selected video segment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SegmentReviewRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string }
                  status: { type: string }

  /api/projects/{projectId}/artifacts:
    x-status: planned
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List artifacts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Artifact" }
    post:
      summary: Start artifact generation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtifactRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifactId: { type: string }
                  jobId: { type: string }

  /api/projects/{projectId}/chat/threads/{threadId}/messages:
    x-status: planned
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: threadId, in: path, required: true, schema: { type: string } }
    get:
      summary: List messages
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ChatMessage" }
    post:
      summary: Send a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                stream: { type: boolean, default: true }
      responses:
        "200":
          description: Assistant reply (or stream)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }

components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    PageToken:
      name: pageToken
      in: query
      schema: { type: string }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    AnalysisRunId:
      name: analysisRunId
      in: path
      required: true
      schema: { type: string }

  responses:
    Accepted:
      description: Accepted
      content:
        application/json:
          schema:
            type: object
            properties:
              jobId: { type: string }
              status: { type: string }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Version conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: [string, "null"] }
            details: { type: object, additionalProperties: true }

    Severity:
      type: string
      enum: [none, low, medium, high, critical]

    Me:
      type: object
      properties:
        uid: { type: string }
        displayName: { type: [string, "null"] }
        email: { type: [string, "null"] }
        onboardingCompleted: { type: boolean }
        personaVersion: { type: [integer, "null"] }
        preferences:
          type: object
          properties:
            timezone: { type: string }
            defaultLanguage: { type: string }
        avatar: { $ref: "#/components/schemas/AvatarState" }

    AvatarState:
      type: object
      description: |
        Humation avatar: a deterministic seed plus per-slot part selections and
        color overrides. Rendered locally; stored on the user document.
      properties:
        seed: { type: [string, "null"] }
        selections: { type: object, additionalProperties: { type: string } }
        colors: { type: object, additionalProperties: { type: string } }

    OnboardingState:
      type: object
      properties:
        status: { type: string, enum: [not_started, in_progress, completed] }
        currentStep: { type: [string, "null"] }
        answers: { type: object, additionalProperties: true }

    OnboardingStep:
      type: object
      required: [step, answers]
      properties:
        step: { type: string }
        answers: { type: object, additionalProperties: true }

    PersonaRef:
      type: object
      properties:
        onboardingCompleted: { type: boolean }
        personaVersion: { type: integer }
        personaStoragePath: { type: string }

    Persona:
      type: object
      properties:
        version: { type: integer }
        content: { type: string }
        storagePath: { type: string }

    CreateProject:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        thumbnailConcept:
          type: string
          description: What the thumbnail promises, so a hook can be judged against it.
        primaryLanguage: { type: string, default: en }
        targetLanguages: { type: array, items: { type: string } }
        targetPlatforms: { type: array, items: { type: string } }
        isDemo: { type: boolean, default: false }
        demoProfileId: { type: [string, "null"] }

    Project:
      allOf:
        - $ref: "#/components/schemas/CreateProject"
        - type: object
          properties:
            projectId: { type: string }
            status:
              type: string
              enum: [draft, uploading, processing, ready, partial_failure, failed, archived]
            progress:
              type: [object, "null"]
              properties:
                stage: { type: [string, "null"] }
                percent: { type: integer }
                message: { type: [string, "null"] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    UploadSessionRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 1 }

    UploadSession:
      type: object
      properties:
        assetId: { type: string }
        storagePath: { type: string }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        requiredHeaders:
          type: object
          additionalProperties: { type: string }

    Asset:
      type: object
      properties:
        assetId: { type: string }
        projectId: { type: string }
        type:
          type: string
          enum: [source_video, audio, frame, clip, thumbnail, caption, export]
        status:
          type: string
          enum: [pending, uploading, uploaded, processing, ready, failed, deleted]
        storagePath: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        durationMs: { type: [integer, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AssetList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }

    DownloadUrl:
      type: object
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    Job:
      type: object
      properties:
        jobId: { type: string }
        type: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progress:
          type: object
          properties:
            percent: { type: integer }
            step: { type: string }
            message: { type: string }
        error: { type: [object, "null"], additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TranscriptSegment:
      type: object
      properties:
        segmentId: { type: string }
        index: { type: integer }
        startMs: { type: integer }
        endMs: { type: integer }
        text: { type: string }
        speaker: { type: [integer, "null"] }

    Transcript:
      type: object
      properties:
        transcriptId: { type: string }
        language: { type: string }
        durationMs: { type: integer }
        segments:
          type: array
          items: { $ref: "#/components/schemas/TranscriptSegment" }

    TranscriptVersion:
      type: object
      properties:
        transcriptId: { type: string }
        version: { type: integer }
        language: { type: string }
        durationMs: { type: integer }
        wordCount: { type: integer }
        createdAt: { type: [string, "null"], format: date-time }

    TranscriptVersionList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TranscriptVersion" }

    AnalysisDimension:
      type: string
      description: |
        Reviewer dimensions. `truth_evidence` through `platform_fit` are core and
        always run; `audience_brand`, `emotional_impact`, and `conversion_cta` are
        opt-in. The trailing values are retired (kept so historical runs still
        deserialize; never requested or run).
      enum:
        - truth_evidence
        - clarity
        - pacing_retention
        - legal_safety
        - cultural_localization
        - platform_fit
        - audience_brand
        - emotional_impact
        - conversion_cta
        - structure_pacing
        - engagement_retention
        - audience_fit
        - brand_voice
        - seo_discoverability
        - visual_accessibility

    AnalysisRequest:
      type: object
      properties:
        dimensions:
          type: array
          description: Extended dimensions to add. Core dimensions always run.
          items: { $ref: "#/components/schemas/AnalysisDimension" }
        platform: { type: string }
        includeVisualReview:
          type: boolean
          default: false
          description: |
            Reserved for the tier-2 multimodal pass. Accepted and recorded on the run,
            but no visual findings are produced until the media worker exists.
        transcriptVersion: { type: integer }

    AnalysisRunStatus:
      type: string
      enum: [queued, running, ready, partial_failure, failed]

    TokenUsage:
      type: object
      properties:
        input: { type: integer }
        output: { type: integer }

    AnalysisRun:
      type: object
      properties:
        analysisRunId: { type: string }
        jobId: { type: string }
        status: { $ref: "#/components/schemas/AnalysisRunStatus" }
        transcriptId: { type: string }
        sourceAssetId: { type: [string, "null"] }
        personaVersion: { type: [integer, "null"] }
        fanoutStrategy: { type: string }
        chunkCount: { type: integer }
        requestedDimensions:
          type: array
          items: { $ref: "#/components/schemas/AnalysisDimension" }
        completedDimensions:
          type: array
          items: { $ref: "#/components/schemas/AnalysisDimension" }
        overallScore: { type: [number, "null"] }
        scoreByDimension:
          type: object
          additionalProperties: { type: number }
        findingCounts:
          type: object
          properties:
            none: { type: integer }
            low: { type: integer }
            medium: { type: integer }
            high: { type: integer }
            critical: { type: integer }
        modelConfigVersion: { type: string }
        promptVersion: { type: string }
        costEstimateUsd: { type: number }
        error: { type: [object, "null"], additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReviewerRunStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    ReviewerRun:
      type: object
      properties:
        reviewerRunId: { type: string }
        dimension: { $ref: "#/components/schemas/AnalysisDimension" }
        status: { $ref: "#/components/schemas/ReviewerRunStatus" }
        findingCount: { type: integer }
        costEstimateUsd: { type: number }
        durationMs: { type: integer }
        model: { type: [string, "null"] }
        inputSegmentCount: { type: integer }
        tokenUsage: { $ref: "#/components/schemas/TokenUsage" }
        error: { type: [object, "null"], additionalProperties: true }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }

    Finding:
      type: object
      required: [dimension, score, confidence, severity, evidence, suggestion]
      properties:
        findingId: { type: string }
        dimension: { $ref: "#/components/schemas/AnalysisDimension" }
        reviewerRunId: { type: [string, "null"] }
        segmentId: { type: [string, "null"] }
        startMs: { type: integer }
        endMs: { type: integer }
        score: { type: integer, minimum: 1, maximum: 5 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        severity: { $ref: "#/components/schemas/Severity" }
        findingType: { type: string }
        evidence:
          type: object
          properties:
            quote: { type: string }
            critique_and_reasoning: { type: string }
        suggestion: { type: string }
        citations:
          type: array
          items: { type: object, additionalProperties: true }

    HeatmapBin:
      type: object
      properties:
        binId: { type: string }
        dimension: { $ref: "#/components/schemas/AnalysisDimension" }
        startMs: { type: integer }
        endMs: { type: integer }
        score: { type: number }
        severity: { $ref: "#/components/schemas/Severity" }
        color: { type: string, enum: [green, yellow, orange, red] }
        findingIds: { type: array, items: { type: string } }

    # --- Realtime WebSocket frames -------------------------------------------------
    # The websocket carries snapshots and progress deltas. Payloads reuse the
    # Project/Job progress sub-objects so the client cache can patch directly.

    WsPing:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [ping] }

    WsSubscribeProject:
      type: object
      required: [type, projectId]
      properties:
        type: { type: string, enum: [subscribe.project] }
        projectId: { type: string }

    WsClientMessage:
      oneOf:
        - $ref: "#/components/schemas/WsSubscribeProject"
        - $ref: "#/components/schemas/WsPing"

    ProjectProgress:
      type: object
      description: Project.progress sub-object (also embedded in Project).
      properties:
        stage: { type: [string, "null"] }
        percent: { type: integer }
        message: { type: [string, "null"] }

    JobProgress:
      type: object
      description: Job.progress sub-object (also embedded in Job).
      properties:
        percent: { type: integer }
        step: { type: string }
        message: { type: string }

    WsSnapshotProject:
      type: object
      required: [type, projectId, status]
      properties:
        type: { type: string, enum: [snapshot.project] }
        projectId: { type: string }
        status:
          type: string
          enum: [draft, uploading, processing, ready, partial_failure, failed, archived]
        progress: { $ref: "#/components/schemas/ProjectProgress" }
        job:
          type: [object, "null"]
          properties:
            jobId: { type: string }
            type: { type: string }
            status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
            progress: { $ref: "#/components/schemas/JobProgress" }

    WsEventProjectProgress:
      type: object
      required: [type, projectId, status]
      properties:
        type: { type: string, enum: [project.progress] }
        projectId: { type: string }
        status:
          type: string
          enum: [draft, uploading, processing, ready, partial_failure, failed, archived]
        progress: { $ref: "#/components/schemas/ProjectProgress" }

    WsEventJobProgress:
      type: object
      required: [type, projectId, jobId]
      properties:
        type: { type: string, enum: [job.progress] }
        projectId: { type: string }
        jobId: { type: string }
        jobType: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progress: { $ref: "#/components/schemas/JobProgress" }
        error: { type: [object, "null"], additionalProperties: true }

    WsEventTranscriptReady:
      type: object
      required: [type, projectId, transcriptId]
      properties:
        type: { type: string, enum: [transcript.ready] }
        projectId: { type: string }
        transcriptId: { type: string }
        jobId: { type: [string, "null"] }
        durationMs: { type: integer }
        language: { type: string }

    WsEventAnalysisProgress:
      type: object
      required: [type, projectId, analysisRunId]
      properties:
        type: { type: string, enum: [analysis.progress] }
        projectId: { type: string }
        analysisRunId: { type: string }
        status: { $ref: "#/components/schemas/AnalysisRunStatus" }
        completedDimensions:
          type: array
          items: { $ref: "#/components/schemas/AnalysisDimension" }
        reviewerStatuses:
          type: array
          description: One entry per reviewer, as known at emit time.
          items:
            type: object
            required: [dimension, status]
            properties:
              dimension: { $ref: "#/components/schemas/AnalysisDimension" }
              status: { $ref: "#/components/schemas/ReviewerRunStatus" }
              findingCount: { type: [integer, "null"] }
              error: { type: [string, "null"] }

    WsEventAnalysisReady:
      type: object
      required: [type, projectId, analysisRunId]
      properties:
        type: { type: string, enum: [analysis.ready] }
        projectId: { type: string }
        analysisRunId: { type: string }
        status: { $ref: "#/components/schemas/AnalysisRunStatus" }
        overallScore: { type: [number, "null"] }
        findingCounts:
          type: object
          properties:
            none: { type: integer }
            low: { type: integer }
            medium: { type: integer }
            high: { type: integer }
            critical: { type: integer }

    WsError:
      type: object
      required: [type, code, message]
      properties:
        type: { type: string, enum: [error] }
        code: { type: string }
        message: { type: string }

    WsPong:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [pong] }

    WsServerMessage:
      oneOf:
        - { $ref: "#/components/schemas/WsSnapshotProject" }
        - { $ref: "#/components/schemas/WsEventProjectProgress" }
        - { $ref: "#/components/schemas/WsEventJobProgress" }
        - { $ref: "#/components/schemas/WsEventTranscriptReady" }
        - { $ref: "#/components/schemas/WsEventAnalysisProgress" }
        - { $ref: "#/components/schemas/WsEventAnalysisReady" }
        - { $ref: "#/components/schemas/WsError" }
        - { $ref: "#/components/schemas/WsPong" }

    SegmentReviewRequest:
      type: object
      required: [startMs, endMs]
      properties:
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 0 }
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/AnalysisDimension" }

    ArtifactRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            - short_clip
            - caption
            - thumbnail
            - social_post
            - blog
            - localized_video
            - dubbed_video
            - veo_intro
            - veo_outro
            - export
        platform: { type: string }
        language: { type: string }
        options: { type: object, additionalProperties: true }

    Artifact:
      type: object
      properties:
        artifactId: { type: string }
        type: { type: string }
        status: { type: string, enum: [queued, generating, ready, failed, deleted] }
        platform: { type: [string, "null"] }
        language: { type: [string, "null"] }
        title: { type: [string, "null"] }
        storagePath: { type: [string, "null"] }
        downloadUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    ChatMessage:
      type: object
      properties:
        messageId: { type: string }
        role: { type: string, enum: [user, assistant, tool] }
        content: { type: string }
        status: { type: string, enum: [complete, streaming, failed] }
        artifactIds: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
