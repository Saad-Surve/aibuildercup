name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight deploy instead of queueing behind it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_ID: habeas-codus
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/habeas-codus/creator-studio-containers

jobs:
  # Decide what actually changed so a backend-only commit does not rebuild the web
  # (and vice versa). Runs on every trigger, so required checks still report.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      # paths-filter diffs a push against the previous commit, so 2 commits of history
      # is enough (it deepens on demand for multi-commit pushes).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # SHA-pinned: this third-party action decides whether either deploy runs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'backend/**'
              - 'contracts/**'
              - '.github/workflows/deploy.yml'
            web:
              - 'web/**'
              - 'firebase.json'
              - 'contracts/**'
              - '.github/workflows/deploy.yml'

  api:
    needs: changes
    # Fail open: if the filter job errored, deploy rather than silently skipping.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # The runner image already ships gcloud; skip_install avoids re-downloading the
      # SDK (~25s) on every deploy. (The system install is locked, so no extra components.)
      - uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4

      # The gha layer cache keeps the uv-sync layer warm, so a code-only change rebuilds
      # in seconds. mode=min keeps the entry small (it shares the repo's 10 GB cache with
      # the web job) and ignore-error stops a cache failure from failing the deploy.
      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true
          provenance: false

      - name: Resolve API service URL
        id: api
        run: |
          url="$(gcloud run services describe creator-studio-api \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)' 2>/dev/null || true)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Deploy API
        env:
          CORS_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || '["https://habeas-codus.web.app","https://habeas-codus.firebaseapp.com"]' }}
          # Deployed model config (see backend/.env.deploy.example). Override any of these with
          # repo variables; the fallbacks are the intended production values. No LLM API key:
          # the runtime service account authenticates to Agent Platform (Vertex AI) with ADC.
          MODEL_REVIEWER: ${{ vars.MODEL_REVIEWER || 'gemini-3.8-flash' }}
          MODEL_ORCHESTRATOR: ${{ vars.MODEL_ORCHESTRATOR || 'gemini-3.8-flash' }}
          MODEL_TRANSCRIPT_REPAIR: ${{ vars.MODEL_TRANSCRIPT_REPAIR || 'gemini-3.8-flash' }}
          LLM_INPUT_PRICE_PER_MTOK: ${{ vars.LLM_INPUT_PRICE_PER_MTOK || '0.75' }}
          LLM_OUTPUT_PRICE_PER_MTOK: ${{ vars.LLM_OUTPUT_PRICE_PER_MTOK || '3.75' }}
          # Web origin the OAuth callback redirects back to.
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://habeas-codus.web.app' }}
          # Read-only demo account. The API rejects its writes and mints its passwordless
          # session; see infra/RESOURCES.md.
          READ_ONLY_USER_UIDS: ${{ vars.READ_ONLY_USER_UIDS || 'demoCreatorHabeasCodus' }}
          DEMO_USER_UID: ${{ vars.DEMO_USER_UID || 'demoCreatorHabeasCodus' }}
        run: |
          # The YouTube connector's OAuth client is optional. The Secret Manager secrets are
          # created empty (see infra/secrets.tf) and gain a version only once a Google OAuth
          # client exists. Attaching a secret with no `latest` version makes Cloud Run fail the
          # whole revision with SecretsAccessCheckFailed, so only attach them when configured;
          # otherwise remove them and the API reports OAUTH_NOT_CONFIGURED for the connector.
          secrets_args="--remove-secrets=GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET"
          if gcloud secrets versions describe latest --secret=youtube-oauth-client-id --project "$PROJECT_ID" >/dev/null 2>&1 \
             && gcloud secrets versions describe latest --secret=youtube-oauth-client-secret --project "$PROJECT_ID" >/dev/null 2>&1; then
            secrets_args="--set-secrets=^|^GOOGLE_OAUTH_CLIENT_ID=youtube-oauth-client-id:latest|GOOGLE_OAUTH_CLIENT_SECRET=youtube-oauth-client-secret:latest"
          fi
          gcloud run deploy creator-studio-api \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$REGISTRY/api:$GITHUB_SHA" \
            --service-account "creator-studio-api@habeas-codus.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 1 \
            --memory 1Gi \
            --no-cpu-throttling \
            --timeout 3600 \
            --quiet \
            "$secrets_args" \
            --set-env-vars "^|^ENVIRONMENT=production|PROJECT_ID=habeas-codus|REGION=us-central1|VERTEX_LOCATION=global|MODEL_REVIEWER=${MODEL_REVIEWER}|MODEL_ORCHESTRATOR=${MODEL_ORCHESTRATOR}|MODEL_TRANSCRIPT_REPAIR=${MODEL_TRANSCRIPT_REPAIR}|LLM_INPUT_PRICE_PER_MTOK=${LLM_INPUT_PRICE_PER_MTOK}|LLM_OUTPUT_PRICE_PER_MTOK=${LLM_OUTPUT_PRICE_PER_MTOK}|CORS_ALLOWED_ORIGINS=${CORS_ORIGINS}|WEB_BASE_URL=${WEB_BASE_URL}|API_PUBLIC_BASE_URL=${{ steps.api.outputs.url }}|PUBSUB_PUSH_AUDIENCE=${{ steps.api.outputs.url }}|PUBSUB_PUSH_SERVICE_ACCOUNT=creator-studio-transcribe@habeas-codus.iam.gserviceaccount.com|READ_ONLY_USER_UIDS=${READ_ONLY_USER_UIDS}|DEMO_USER_UID=${DEMO_USER_UID}"

  web:
    needs: changes
    # Fail open: if the filter job errored, deploy rather than silently skipping.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' || needs.changes.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # The realtime WebSocket must reach the Cloud Run service directly: Firebase
      # Hosting rewrites do not proxy WebSocket upgrades. Resolve the stable service
      # URL here (after auth) so it can be inlined into the web build.
      - id: api_url
        name: Resolve API URL for the WebSocket
        run: |
          url="$(gcloud run services describe creator-studio-api \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # SHA-pinned third-party action.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Cache bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Turbopack's build cache. NEXT_PUBLIC_API_BASE_URL is inlined at build time, so
      # vars.API_URL is part of the key: otherwise changing it ships a stale build from
      # the restore-key fallback.
      - name: Cache Next build
        uses: actions/cache@v5
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}-${{ vars.API_URL }}-${{ steps.api_url.outputs.url }}-${{ hashFiles('web/src/**', 'web/next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}-${{ vars.API_URL }}-${{ steps.api_url.outputs.url }}-

      # npx otherwise re-downloads firebase-tools (~25s) on every run. Scoped to the
      # npx cache (not all of ~/.npm).
      - name: Cache firebase-tools
        uses: actions/cache@v5
        with:
          path: ~/.npm/_npx
          key: npm-firebase-${{ runner.os }}-13
          restore-keys: npm-firebase-${{ runner.os }}-

      - name: Build web (static export)
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_URL }}
          # WebSocket base: the Cloud Run URL directly (Hosting rewrites do not
          # proxy upgrades). Falls back to the API origin when empty.
          NEXT_PUBLIC_WS_BASE_URL: ${{ steps.api_url.outputs.url }}
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAjWq40FQKv6pN9LJI1glJq6gsfOTMNi7Q
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: habeas-codus.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: habeas-codus
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: habeas-codus.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:538724167565:web:87eb1e0f5245b5079217c4
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 538724167565
          # One-click passwordless demo (POST /demo/session mints the custom token).
          NEXT_PUBLIC_DEMO_ENABLED: "true"
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Deploy web (Firebase Hosting)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: npx --yes firebase-tools@13 deploy --only hosting --project "$PROJECT_ID" --non-interactive
