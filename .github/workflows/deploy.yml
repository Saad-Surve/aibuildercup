name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: habeas-codus
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/habeas-codus/creator-studio-containers

jobs:
  deploy:
    # Blacksmith drop-in runner. Swap to ubuntu-latest if the Blacksmith app isn't installed.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: aibuildercup/api
      - uses: useblacksmith/build-push-action@v2
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ github.sha }}

      - name: Build and push web image
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: aibuildercup/web
      - uses: useblacksmith/build-push-action@v2
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_MOCK_MODE=off
            NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyAjWq40FQKv6pN9LJI1glJq6gsfOTMNi7Q
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=habeas-codus.firebaseapp.com
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=habeas-codus
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=habeas-codus.firebasestorage.app
            NEXT_PUBLIC_FIREBASE_APP_ID=1:538724167565:web:87eb1e0f5245b5079217c4
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=538724167565

      - name: Deploy API
        env:
          CORS_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || '["https://habeas-codus.web.app","https://habeas-codus.firebaseapp.com"]' }}
        run: |
          gcloud run deploy creator-studio-api \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$REGISTRY/api:$GITHUB_SHA" \
            --service-account "creator-studio-api@habeas-codus.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 1 \
            --set-env-vars "^@^ENVIRONMENT=production@PROJECT_ID=habeas-codus@REGION=us-central1@MOCK_MODE=off@CORS_ALLOWED_ORIGINS=${CORS_ORIGINS}"

      - name: Deploy web
        run: |
          gcloud run deploy creator-studio-web \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$REGISTRY/web:$GITHUB_SHA" \
            --service-account "creator-studio-web@habeas-codus.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 3
