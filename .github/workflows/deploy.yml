name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: habeas-codus
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/habeas-codus/creator-studio-containers

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        run: |
          docker build -t "$REGISTRY/api:$GITHUB_SHA" backend
          docker push "$REGISTRY/api:$GITHUB_SHA"

      - name: Deploy API
        env:
          CORS_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || '["https://habeas-codus.web.app","https://habeas-codus.firebaseapp.com"]' }}
        run: |
          gcloud run deploy creator-studio-api \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$REGISTRY/api:$GITHUB_SHA" \
            --service-account "creator-studio-api@habeas-codus.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 1 \
            --no-cpu-throttling \
            --set-env-vars "^|^ENVIRONMENT=production|PROJECT_ID=habeas-codus|REGION=us-central1|CORS_ALLOWED_ORIGINS=${CORS_ORIGINS}|PUBSUB_PUSH_AUDIENCE=${{ vars.API_URL }}|PUBSUB_PUSH_SERVICE_ACCOUNT=creator-studio-transcribe@habeas-codus.iam.gserviceaccount.com" \
            --set-secrets "GEMINI_API_KEY=gemini-api-key:latest"

      - uses: oven-sh/setup-bun@v2

      - name: Build web (static export)
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAjWq40FQKv6pN9LJI1glJq6gsfOTMNi7Q
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: habeas-codus.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: habeas-codus
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: habeas-codus.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:538724167565:web:87eb1e0f5245b5079217c4
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 538724167565
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Deploy web (Firebase Hosting)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: npx --yes firebase-tools@13 deploy --only hosting --project "$PROJECT_ID" --non-interactive
